[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-gate"
version = "0.1.0"
description = "离线 JSONL 契约分流：组合式 JSON Schema 子集求值、覆盖证据与精确定位"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
cgate = "contract_gate.cli:main"

[tool.setuptools]
packages = ["contract_gate"]
